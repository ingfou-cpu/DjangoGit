{% extends 'store/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid rounded shadow" alt="{{ product.name }}">
        {% else %}
            <div class="bg-light d-flex align-items-center justify-content-center border" style="height: 400px;">
                <span class="text-muted">Image non disponible</span>
            </div>
        {% endif %}
    </div>
    <div class="col-md-6">
        <h1>{{ product.name }}</h1>
        <h2 class="text-primary my-3">{{ product.price }} €</h2>
        <p class="lead">{{ product.description|linebreaks }}</p>
        <button class="btn btn-dark btn-lg w-100 mt-4">Ajouter au panier</button>
    </div>
</div>
{% endblock %}
