{% extends 'base.html' %}

{% block content %}
    <h1> Join Us </h1>
    <br/><br/>
    <form method="post" action="{% url 'join' %}">
        {% csrf_token %}
<div class="mb-3">
    <input type="text" class="form-control"  placeholder="Enter your name" name="name">
</div>

<div class="mb-3">
    <input type="text" class="form-control"   placeholder="Enter your last name" name="lname">
</div>

<div class="mb-3">
    <input type="number" class="form-control"  placeholder="Enter your age" name="age">
</div>

<div class="mb-3">
    <input type="email" class="form-control" aria-describedby="emailHelp" placeholder="Enter your email" name="email">
</div>

<div class="mb-3">
    <!--  <label for="exampleInputEmail1" class="form-label">Email address</label>    -->
    <input type="number" class="form-control"   placeholder="Enter your phone number" name="phone">

</div>

<div class="mb-3">
    <!-- <label for="exampleInputPassword1" class="form-label">Password</label>-->  
    <input type="text" class="form-control"  placeholder="Enter your address" name="address">
</div>
<br/>
<!--  div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="exampleCheck1">
    <label class="form-check-label" for="exampleCheck1">Check me out</label>
  </div> -->
  <button type="submit" class="btn btn-secondary">sign-up</button>
</form>
{% endblock %}
