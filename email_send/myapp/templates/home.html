<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
</head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Exo+2:wght@300;400;600&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Exo 2', sans-serif;
        overflow: hidden;
    }

    .container {
        width: 100%;
        max-width: 500px;
        padding: 2rem;
        z-index: 1;
        position: relative;
    }

    h1 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        font-size: 2.5rem;
        margin-bottom: 2rem;
        background: linear-gradient(90deg, #001f3f, #8e2ee2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 10px rgba(0, 31, 63, 0.5);
        letter-spacing: 2px;
        position: relative;
    }

    h1::after {
        content: "";
        position: absolute;
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 3px;
        background: linear-gradient(90deg, #001f3f, #8e2ee2);
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(142, 46, 226, 0.5);
    }

    form {
        background: rgba(15, 12, 41, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 2rem;
        box-shadow: 
            0 0 20px rgba(142, 46, 226, 0.3),
            inset 0 0 10px rgba(142, 46, 226, 0.2);
        border: 1px solid rgba(142, 46, 226, 0.3);
        position: relative;
        overflow: hidden;
    }

    form::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, transparent, #8e2ee2, #001f3f, transparent);
        animation: scan 3s linear infinite;
    }

    @keyframes scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .input-group {
        margin-bottom: 1.5rem;
    }

    input[type="email"] {
        width: 100%;
        padding: 15px;
        background: rgba(10, 10, 30, 0.7);
        border: 1px solid rgba(142, 46, 226, 0.3);
        border-radius: 8px;
        color: #ffffff;
        font-family: 'Exo 2', sans-serif;
        font-size: 1rem;
        outline: none;
        transition: all 0.3s ease;
        box-shadow: 0 0 5px rgba(142, 46, 226, 0.2);
    }

    input[type="email"]:focus {
        border-color: #8e2ee2;
        box-shadow: 0 0 15px rgba(142, 46, 226, 0.4);
    }

    input[type="email"]::placeholder {
        color: #8a8a9f;
    }

    button {
        width: 100%;
        padding: 15px;
        background: linear-gradient(90deg, #001f3f, #8e2ee2);
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-family: 'Orbitron', sans-serif;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        letter-spacing: 1px;
        text-transform: uppercase;
        position: relative;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(142, 46, 226, 0.4);
    }

    button:active {
        transform: translateY(1px);
    }

    button::after {
        content: "";
        position: absolute;
        top: -50%;
        left: -60%;
        width: 20px;
        height: 200%;
        background: rgba(255, 255, 255, 0.3);
        transform: rotate(30deg);
        transition: all 0.6s;
    }

    button:hover::after {
        left: 120%;
    }

    .messages {
        margin-top: 1.5rem;
        text-align: center;
    }

    .messages p {
        padding: 12px;
        border-radius: 8px;
        margin: 10px 0;
        font-family: 'Exo 2', sans-serif;
        font-weight: 500;
        animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .success {
        background: rgba(0, 200, 100, 0.2);
        border: 1px solid rgba(0, 200, 100, 0.4);
        box-shadow: 0 0 10px rgba(0, 200, 100, 0.2);
    }

    .error {
        background: rgba(200, 50, 50, 0.2);
        border: 1px solid rgba(200, 50, 50, 0.4);
        box-shadow: 0 0 10px rgba(200, 50, 50, 0.2);
    }

    .info {
        background: rgba(50, 100, 200, 0.2);
        border: 1px solid rgba(50, 100, 200, 0.4);
        box-shadow: 0 0 10px rgba(50, 100, 200, 0.2);
    }

    .glow-circle {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(142, 46, 226, 0.2), transparent 70%);
        filter: blur(20px);
        z-index: -1;
    }

    .circle-1 {
        top: 10%;
        left: 10%;
    }

    .circle-2 {
        bottom: 10%;
        right: 10%;
        background: radial-gradient(circle, rgba(0, 31, 63, 0.2), transparent 70%);
    }

    @media (max-width: 600px) {
        .container {
            padding: 1rem;
        }
        
        h1 {
            font-size: 2rem;
        }
        
        form {
            padding: 1.5rem;
        }
    }
</style>
<body>
    <div class="glow-circle circle-1"></div>
    <div class="glow-circle circle-2"></div>
    
    <div class="container">
        <h1>Email Verification System</h1>
        <form method="post">
            {% csrf_token %}
            <div class="input-group">
                <input type="email" name="email" placeholder="Enter your email address" required>
            </div>
            <button type="submit">Send Verification Email</button>
        </form>
        
        <div class="messages">
            {% if messages %}
                {% for message in messages %}
                    <p{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</p>
                {% endfor %}
            {% endif %}
        </div>
    </div>
</body>
</html>
